<section class="settings">
  <h2 class="settings-heading">AIダッシュボード for kintone 設定</h2>
  <p class="kintoneplugin-desc">
    このプラグインに保存が必要な設定はありません。レコード一覧画面のヘッダーに追加される「現在のクエリでダッシュボードを作成」ボタンから、
    そのつどAIプロバイダ・モデル・APIキーを入力してダッシュボードを作成します。<br>
    入力したAPIキーはどこにも保存されず、ダッシュボードの画面を閉じると破棄されます。<br>
    非公開の検証用プラグインです。有効化する前に、対象アプリの利用者にAIへの問い合わせ内容(絞り込み条件やフィールドの名称・集計結果)が
    選択したAIプロバイダに送信されることを周知してください(レコードの生データそのものは送信しません)。
  </p>

  <form class="js-submit-settings">
    <p class="kintoneplugin-row">
      <button type="button" class="js-cancel-button kintoneplugin-button-dialog-cancel">Cancel</button>
      <button class="kintoneplugin-button-dialog-ok">Save</button>
    </p>
  </form>
</section>
